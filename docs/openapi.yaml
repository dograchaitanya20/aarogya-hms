openapi: 3.0.3
info:
  title: Aarogya HMS API
  version: 1.1.0
  description: Hospital Management System REST API with server-side RBAC, strict
    audit logging, btree_gist exclusion constraints against doctor/patient
    double-booking, and synthetic data only.
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aarogya_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Unique key to ensure idempotent creation and prevent duplicate processing
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: SLOT_TAKEN
            message:
              type: string
              example: The requested slot is already booked
            details:
              type: object
            requestId:
              type: string
              example: b18ca0e6-59b3-4674-a69c-29da229a1740
          required:
            - code
            - message
            - details
            - requestId
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appointmentNumber:
          type: string
          example: APT-2026-00001
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - scheduled
            - checked_in
            - in_consultation
            - completed
            - cancelled
            - no_show
        version:
          type: integer
          example: 1
paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - System
      responses:
        "200":
          description: Service is healthy and database is connected
  /auth/login:
    post:
      summary: Authenticate user and set session cookie
      tags:
        - Authentication
      responses:
        "200":
          description: Authentication successful
        "401":
          description: Invalid credentials
  /slots:
    get:
      summary: Search available slots aligned to schedule in hospital timezone
      tags:
        - Slots
      parameters:
        - name: doctorId
          in: query
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            example: 2027-01-11
        - name: to
          in: query
          required: true
          schema:
            type: string
            example: 2027-01-12
      responses:
        "200":
          description: Available slots computed in Asia/Kolkata
        "422":
          description: Range exceeds 14 days or invalid format
  /appointments:
    post:
      summary: Book a new appointment (Front Desk only; requires Idempotency-Key)
      tags:
        - Appointments
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Appointment booked
        "409":
          description: SLOT_TAKEN or PATIENT_DOUBLE_BOOKED
        "422":
          description: VALIDATION_ERROR or IDEMPOTENCY_KEY_REUSED
    get:
      summary: List appointments with filters and pagination
      tags:
        - Appointments
      responses:
        "200":
          description: Paginated list of appointments
  /appointments/{id}/reschedule:
    patch:
      summary: Reschedule appointment with optimistic locking version check
      tags:
        - Appointments
      responses:
        "200":
          description: Reschedule successful
        "409":
          description: STALE_VERSION or SLOT_TAKEN
  /appointments/{id}/status:
    patch:
      summary: Transition appointment status (State Machine enforcement)
      tags:
        - Appointments
      responses:
        "200":
          description: Status updated
        "409":
          description: INVALID_TRANSITION
  /patients/{id}:
    put:
      summary: Update patient demographics (Front Desk only; audited before/after)
      tags:
        - Patients
      responses:
        "200":
          description: Patient updated
        "403":
          description: Forbidden
  /directory/schedules:
    post:
      summary: Create doctor schedule rule with overlap checks (Admin only)
      tags:
        - Directory
      responses:
        "201":
          description: Schedule created
        "409":
          description: Overlapping schedule conflict
  /directory/staff:
    get:
      summary: List staff users without password hashes (Admin only)
      tags:
        - Directory
      responses:
        "200":
          description: Staff list
    post:
      summary: Create staff user with bcrypt hashing (Admin only)
      tags:
        - Directory
      responses:
        "201":
          description: Staff created
