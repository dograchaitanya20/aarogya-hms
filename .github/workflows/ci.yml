name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend CI & Real Database Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aarogya_hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax & Lint check
        run: npm run lint

      - name: Validate OpenAPI spec
        run: npm run docs:openapi

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aarogya_hms_test
        run: npm run migrate

      - name: Run synthetic seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aarogya_hms_test
        run: npm run seed

      - name: Execute Vitest against test database
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aarogya_hms_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aarogya_hms_test
          JWT_SECRET: ci-test-secret-min-32-characters-long
        run: npm test

      - name: Run Race Condition Demo
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aarogya_hms_test
        run: npm run demo:race
